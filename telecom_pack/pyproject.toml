[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telecom-pack"
version = "0.1.0"
description = "Telecommunications AI guardrails pack — TCPA, CPNI, FCC compliance, rate plan fairness, accessibility, and telecom-specific pen testing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Radhika Venkatraman" },
]
keywords = ["telecom", "guardrails", "compliance", "ai-governance", "fcc", "tcpa", "cpni"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Telecommunications Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Telephony",
    "Topic :: Security",
]

dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
